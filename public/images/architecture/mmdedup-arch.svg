<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">MMdedup 多模态去重研究管道</title>
  <desc id="desc">原始混合数据经过文件整理、模态候选召回、关系验证、安全删除和实验证据归档；图文对另进入 Stage 4 联合判断。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
    <style>
      .title{font:700 24px ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#e2e8f0}
      .step{font:600 12px ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#94a3b8;letter-spacing:.08em}
      .head{font:650 16px ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}
      .body{font:400 12px ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#94a3b8}
      .small{font:500 11px ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#cbd5e1}
      .box{fill:#111827;stroke:#334155;stroke-width:1.5}
      .line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1120" height="680" rx="22" fill="#0b1120"/>
  <text x="42" y="48" class="title">MMdedup · 检索候选、判断关系，再决定是否删除</text>

  <text x="42" y="96" class="step">01 INGEST</text>
  <rect x="42" y="114" width="180" height="96" rx="14" class="box"/>
  <text x="132" y="143" text-anchor="middle" class="head">Raw Dataset</text>
  <text x="132" y="167" text-anchor="middle" class="body">文本 · 图像 · 音频</text>
  <text x="132" y="187" text-anchor="middle" class="body">图像—描述训练对</text>

  <text x="274" y="96" class="step">02 SORT &amp; MANIFEST</text>
  <rect x="274" y="114" width="210" height="96" rx="14" fill="#2b2012" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="379" y="143" text-anchor="middle" class="head">Sorter</text>
  <text x="379" y="167" text-anchor="middle" class="body">类型识别 · 解码检查</text>
  <text x="379" y="187" text-anchor="middle" class="body">稳定 ID · 输入清单</text>
  <path d="M222 162 H274" class="line"/>

  <text x="536" y="96" class="step">03 BOUNDED RETRIEVAL</text>
  <rect x="536" y="114" width="244" height="96" rx="14" fill="#10213a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="658" y="143" text-anchor="middle" class="head">Candidate Retrieval</text>
  <text x="658" y="167" text-anchor="middle" class="body">Hash / MinHash-LSH / ANN</text>
  <text x="658" y="187" text-anchor="middle" class="body">只召回有限候选，不直接删除</text>
  <path d="M484 162 H536" class="line"/>

  <text x="832" y="96" class="step">04 RELATION TYPING</text>
  <rect x="832" y="114" width="246" height="96" rx="14" fill="#211734" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="955" y="143" text-anchor="middle" class="head">Relation Verification</text>
  <text x="955" y="167" text-anchor="middle" class="body">局部证据 · 双向覆盖 · 时间对齐</text>
  <text x="955" y="187" text-anchor="middle" class="body">FULL / PARTIAL / DISTINCT</text>
  <path d="M780 162 H832" class="line"/>

  <rect x="42" y="264" width="314" height="154" rx="16" fill="#0f172a" stroke="#1e293b"/>
  <text x="64" y="294" class="step">TEXT-V2</text>
  <text x="64" y="326" class="head">全文与段落两级候选</text>
  <text x="64" y="352" class="body">Jaccard + directional containment</text>
  <text x="64" y="376" class="body">区分完整重复、包含与语义相似</text>
  <rect x="64" y="392" width="156" height="8" rx="4" fill="#38bdf8"/>

  <rect x="403" y="264" width="314" height="154" rx="16" fill="#0f172a" stroke="#1e293b"/>
  <text x="425" y="294" class="step">IMAGE-I6</text>
  <text x="425" y="326" class="head">全图召回与 patch 对应</text>
  <text x="425" y="352" class="body">双向覆盖 + 局部几何一致性</text>
  <text x="425" y="376" class="body">识别裁剪、截图、拼接与安全负例</text>
  <rect x="425" y="392" width="156" height="8" rx="4" fill="#a78bfa"/>

  <rect x="764" y="264" width="314" height="154" rx="16" fill="#0f172a" stroke="#1e293b"/>
  <text x="786" y="294" class="step">AUDIO-A7</text>
  <text x="786" y="326" class="head">录音身份与时间覆盖分离</text>
  <text x="786" y="352" class="body">频谱地标 + 匹配区间</text>
  <text x="786" y="376" class="body">区分完整复制、局部复用与不同录音</text>
  <rect x="786" y="392" width="156" height="8" rx="4" fill="#fb7185"/>

  <path d="M658 210 C620 235 300 228 208 264" class="dash"/>
  <path d="M658 210 V264" class="dash"/>
  <path d="M658 210 C698 235 890 228 921 264" class="dash"/>

  <rect x="42" y="470" width="506" height="164" rx="16" fill="#11281f" stroke="#4ade80" stroke-width="1.5"/>
  <text x="66" y="500" class="step">SAFE ACTION</text>
  <text x="66" y="534" class="head">关系与删除权限分离</text>
  <text x="66" y="560" class="body">只有证据充分的完整重复进入删除候选；PARTIAL 与不确定样本默认保留。</text>
  <rect x="66" y="584" width="138" height="30" rx="15" fill="#14532d"/>
  <text x="135" y="604" text-anchor="middle" class="small">FULL → candidate</text>
  <rect x="218" y="584" width="138" height="30" rx="15" fill="#3f2b12"/>
  <text x="287" y="604" text-anchor="middle" class="small">PARTIAL → keep</text>
  <rect x="370" y="584" width="138" height="30" rx="15" fill="#1e293b"/>
  <text x="439" y="604" text-anchor="middle" class="small">DISTINCT → keep</text>

  <rect x="584" y="470" width="494" height="164" rx="16" fill="#171a2f" stroke="#818cf8" stroke-width="1.5"/>
  <text x="608" y="500" class="step">STAGE 4 &amp; EVIDENCE</text>
  <text x="608" y="534" class="head">图文对联合判断 + 可追溯实验账本</text>
  <text x="608" y="560" class="body">image / text / joint 信号与单模态、naive union 同协议比较</text>
  <text x="608" y="583" class="body">配置 · 数据 revision · SHA · 逐样本预测 · 指标 · 环境</text>
  <text x="608" y="606" class="body">PASS / PARTIAL / NARROW / NEGATIVE / UNVERIFIED</text>
  <path d="M955 210 C1010 340 985 420 950 470" class="line"/>
  <path d="M832 418 C790 446 650 447 548 532" class="line"/>
</svg>
