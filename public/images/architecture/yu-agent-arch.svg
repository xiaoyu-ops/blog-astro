<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc">
  <title id="title">yu_agent 模块架构</title>
  <desc id="desc">统一 LLM 接口连接四类 Agent，Agent 使用工具注册表和 MCP，并由 ContextBuilder 从消息、工作记忆、情景记忆与语义记忆中构建上下文。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
    <style>
      .title{font:700 24px ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#e2e8f0}
      .step{font:600 12px ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#94a3b8;letter-spacing:.08em}
      .head{font:650 16px ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}
      .body{font:400 12px ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#94a3b8}
      .small{font:500 11px ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#cbd5e1}
      .box{fill:#111827;stroke:#334155;stroke-width:1.5}
      .line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1120" height="690" rx="22" fill="#0b1120"/>
  <text x="42" y="48" class="title">yu_agent · 可逐层拆开的 Agent 学习框架</text>

  <rect x="42" y="92" width="188" height="90" rx="14" class="box"/>
  <text x="136" y="123" text-anchor="middle" class="head">Application</text>
  <text x="136" y="147" text-anchor="middle" class="body">用户输入 · 显式选择 Agent</text>
  <text x="136" y="167" text-anchor="middle" class="body">不是自动任务路由</text>

  <rect x="296" y="78" width="510" height="122" rx="16" fill="#10213a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="320" y="107" class="step">AGENT CONTROL FLOWS</text>
  <rect x="320" y="128" width="104" height="48" rx="10" class="box"/>
  <text x="372" y="158" text-anchor="middle" class="small">Simple</text>
  <rect x="438" y="128" width="104" height="48" rx="10" class="box"/>
  <text x="490" y="158" text-anchor="middle" class="small">ReAct</text>
  <rect x="556" y="128" width="104" height="48" rx="10" class="box"/>
  <text x="608" y="158" text-anchor="middle" class="small">Reflection</text>
  <rect x="674" y="128" width="108" height="48" rx="10" class="box"/>
  <text x="728" y="158" text-anchor="middle" class="small">Plan &amp; Solve</text>
  <path d="M230 137 H296" class="line"/>

  <rect x="872" y="92" width="206" height="90" rx="14" fill="#2b2012" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="975" y="123" text-anchor="middle" class="head">AgentsLLM</text>
  <text x="975" y="147" text-anchor="middle" class="body">OpenAI-compatible adapters</text>
  <text x="975" y="167" text-anchor="middle" class="body">provider 在实例化时确定</text>
  <path d="M806 137 H872" class="line"/>

  <rect x="42" y="274" width="310" height="150" rx="16" fill="#211734" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="66" y="303" class="step">TOOLS</text>
  <text x="66" y="336" class="head">ToolRegistry</text>
  <text x="66" y="362" class="body">注册 · 描述 · 执行 · 异常回传</text>
  <text x="66" y="386" class="body">calculator · search · terminal · memory</text>
  <text x="66" y="410" class="small">由 ReAct / SimpleAgent 调用</text>

  <rect x="405" y="274" width="310" height="150" rx="16" fill="#171a2f" stroke="#818cf8" stroke-width="1.5"/>
  <text x="429" y="303" class="step">PROTOCOLS</text>
  <text x="429" y="336" class="head">MCP Client / Server</text>
  <text x="429" y="362" class="body">FastMCP · memory · stdio · HTTP / SSE</text>
  <text x="429" y="386" class="body">外部工具发现与调用</text>
  <text x="429" y="410" class="small">另有 ANP / A2A 实验模块</text>

  <rect x="768" y="274" width="310" height="150" rx="16" fill="#11281f" stroke="#4ade80" stroke-width="1.5"/>
  <text x="792" y="303" class="step">CONTEXT</text>
  <text x="792" y="336" class="head">ContextBuilder</text>
  <text x="792" y="362" class="body">相关性 · 时效性 · MMR · token budget</text>
  <text x="792" y="386" class="body">messages + memory + RAG</text>
  <text x="792" y="410" class="small">构建下一次模型调用的上下文</text>

  <path d="M490 200 C440 232 255 232 197 274" class="line"/>
  <path d="M510 274 C517 240 538 222 551 200" class="line"/>
  <path d="M923 274 C852 232 690 226 635 200" class="line"/>
  <path d="M352 349 H405" class="line"/>
  <path d="M715 349 H768" class="line"/>

  <rect x="42" y="492" width="1036" height="150" rx="16" fill="#0f172a" stroke="#1e293b"/>
  <text x="66" y="521" class="step">MEMORY MANAGER</text>
  <rect x="66" y="545" width="208" height="70" rx="12" class="box"/>
  <text x="170" y="573" text-anchor="middle" class="head">Working</text>
  <text x="170" y="596" text-anchor="middle" class="body">capacity 10 · 2,000 tokens</text>
  <rect x="300" y="545" width="208" height="70" rx="12" class="box"/>
  <text x="404" y="573" text-anchor="middle" class="head">Episodic</text>
  <text x="404" y="596" text-anchor="middle" class="body">SQLite + Qdrant index</text>
  <rect x="534" y="545" width="208" height="70" rx="12" class="box"/>
  <text x="638" y="573" text-anchor="middle" class="head">Semantic</text>
  <text x="638" y="596" text-anchor="middle" class="body">vector + entity relations</text>
  <rect x="768" y="545" width="208" height="70" rx="12" class="box"/>
  <text x="872" y="573" text-anchor="middle" class="head">Perceptual</text>
  <text x="872" y="596" text-anchor="middle" class="body">optional · disabled by default</text>
  <path d="M923 424 C923 460 872 468 872 492" class="line"/>
  <path d="M768 580 H742" class="dash"/>
  <path d="M534 580 H508" class="dash"/>
  <path d="M300 580 H274" class="dash"/>
</svg>
