<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 650" role="img" aria-labelledby="title desc">
  <title id="title">JunkFilter 系统架构</title>
  <desc id="desc">系统分为 RSS 采集、LLM 评估与用户交互三条链路，Redis Stream 解耦抓取和评估，PostgreSQL 保存订阅、文章、评估结果与偏好。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
    <style>
      .title{font:700 24px ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#e2e8f0}
      .lane{font:600 13px ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#94a3b8;letter-spacing:.08em}
      .head{font:650 16px ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}
      .body{font:400 12px ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#94a3b8}
      .label{font:500 11px ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#cbd5e1}
      .box{fill:#111827;stroke:#334155;stroke-width:1.5}
      .line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#475569;stroke-width:1.5;stroke-dasharray:6 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1080" height="650" rx="22" fill="#0b1120"/>
  <text x="44" y="48" class="title">JunkFilter · 从 RSS 到可交互的内容评估</text>

  <rect x="32" y="75" width="1016" height="156" rx="16" fill="#0f172a" stroke="#1e293b"/>
  <text x="54" y="103" class="lane">01 采集链路</text>
  <rect x="72" y="126" width="170" height="72" rx="12" class="box"/>
  <text x="157" y="154" text-anchor="middle" class="head">RSS Sources</text>
  <text x="157" y="177" text-anchor="middle" class="body">定时抓取 · 来源级间隔</text>
  <rect x="326" y="116" width="220" height="92" rx="12" fill="#10213a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="436" y="146" text-anchor="middle" class="head">Go Fetcher</text>
  <text x="436" y="169" text-anchor="middle" class="body">Worker Pool · 正文清洗</text>
  <text x="436" y="188" text-anchor="middle" class="body">Bloom → Redis → DB UNIQUE</text>
  <rect x="646" y="126" width="190" height="72" rx="12" fill="#211734" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="741" y="154" text-anchor="middle" class="head">Redis Stream</text>
  <text x="741" y="177" text-anchor="middle" class="body">Consumer Group · Pending</text>
  <path d="M242 162 H326" class="line"/>
  <path d="M546 162 H646" class="line"/>
  <text x="590" y="150" text-anchor="middle" class="label">XADD</text>

  <rect x="32" y="247" width="1016" height="156" rx="16" fill="#0f172a" stroke="#1e293b"/>
  <text x="54" y="275" class="lane">02 评估链路</text>
  <rect x="326" y="289" width="220" height="82" rx="12" fill="#11281f" stroke="#4ade80" stroke-width="1.5"/>
  <text x="436" y="318" text-anchor="middle" class="head">Python Consumer</text>
  <text x="436" y="341" text-anchor="middle" class="body">偏好注入 · 有限重试</text>
  <text x="436" y="360" text-anchor="middle" class="body">LangGraph 结构化评估</text>
  <rect x="646" y="289" width="190" height="82" rx="12" fill="#2a1d12" stroke="#fb923c" stroke-width="1.5"/>
  <text x="741" y="318" text-anchor="middle" class="head">PostgreSQL</text>
  <text x="741" y="341" text-anchor="middle" class="body">Articles · Evaluations</text>
  <text x="741" y="360" text-anchor="middle" class="body">Preferences · Notifications</text>
  <path d="M646 191 C600 225 570 274 546 319" class="line"/>
  <text x="597" y="257" class="label">XREADGROUP</text>
  <path d="M546 330 H646" class="line"/>
  <text x="592" y="318" text-anchor="middle" class="label">persist</text>
  <path d="M720 289 C695 244 681 224 707 199" class="dash"/>
  <text x="741" y="246" class="label">ACK after persist</text>

  <rect x="32" y="419" width="1016" height="198" rx="16" fill="#0f172a" stroke="#1e293b"/>
  <text x="54" y="447" class="lane">03 交互与通知</text>
  <rect x="72" y="477" width="170" height="92" rx="12" fill="#10213a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="157" y="506" text-anchor="middle" class="head">Vue Web / Tauri</text>
  <text x="157" y="529" text-anchor="middle" class="body">阅读器 · 配置中心</text>
  <text x="157" y="548" text-anchor="middle" class="body">SSE 工具调用过程</text>
  <rect x="326" y="477" width="220" height="92" rx="12" fill="#2b1830" stroke="#f472b6" stroke-width="1.5"/>
  <text x="436" y="506" text-anchor="middle" class="head">ReAct Agent API</text>
  <text x="436" y="529" text-anchor="middle" class="body">查询 · 订阅管理 · 偏好更新</text>
  <text x="436" y="548" text-anchor="middle" class="body">OpenAI Function Calling</text>
  <rect x="646" y="477" width="190" height="92" rx="12" fill="#142438" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="741" y="506" text-anchor="middle" class="head">Telegram Bot</text>
  <text x="741" y="529" text-anchor="middle" class="body">长轮询 · 用户队列</text>
  <text x="741" y="548" text-anchor="middle" class="body">查询与主动推送</text>
  <path d="M242 523 H326" class="line"/>
  <text x="284" y="511" text-anchor="middle" class="label">POST + SSE</text>
  <path d="M646 523 H546" class="line"/>
  <path d="M436 477 C470 420 585 397 671 371" class="line"/>
  <path d="M741 477 V371" class="dash"/>
  <text x="755" y="427" class="label">通知</text>
  <rect x="880" y="477" width="130" height="92" rx="12" class="box"/>
  <text x="945" y="506" text-anchor="middle" class="head">LLM API</text>
  <text x="945" y="529" text-anchor="middle" class="body">兼容接口</text>
  <text x="945" y="548" text-anchor="middle" class="body">流式输出</text>
  <path d="M546 502 C680 456 798 456 880 502" class="line"/>
  <path d="M546 336 C710 394 823 429 892 477" class="dash"/>
</svg>
